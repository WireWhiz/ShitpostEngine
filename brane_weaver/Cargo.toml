[package]
name = "brane_weaver"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "weaver_server"

[lib]

[dependencies]
brane_weaver_proc = { path="proc" }
clap = { version = "4.6.1", features = ["derive"] }
libloading = "0.9.0"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
websocket = "0.27.1"
